<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <h1>User Registration</h1>

    <div class="form-box">

        <form method="POST">

            <input type="text"
            name="name"
            placeholder="Enter Name"
            required>

            <input type="email"
            name="email"
            placeholder="Enter Email"
            required>

            <input type="password"
            name="password"
            placeholder="Enter Password"
            required>

            <button type="submit">
                Register
            </button>

        </form>

    </div>

</body>
</html>
